# openssh-server（jump 端口转发容器）
; 仅 jump 镜像使用，ENABLE_SSH 默认 true
; 当 sshd 未安装时 dwc-openssh 会 exit 0 跳过，此时 supervisord 不应重启
[program:openssh]
command=/usr/local/bin/dwc-if ENABLE_SSH /usr/local/bin/dwc-openssh
autostart=true
autorestart=unexpected
startretries=3
priority=5
stdout_logfile=/config/logs/openssh.log
stderr_logfile=/config/logs/openssh.err.log
