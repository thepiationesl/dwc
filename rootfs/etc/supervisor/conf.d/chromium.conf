# chromium 浏览器隔离（browser 镜像，CDP 端口 9222）
; ENABLE_CHROMIUM 默认 true
[program:chromium]
command=/usr/local/bin/dwc-if ENABLE_CHROMIUM /usr/local/bin/dwc-chromium
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/config/logs/chromium.log
stderr_logfile=/config/logs/chromium.err.log
