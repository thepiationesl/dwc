# VNC + noVNC（桌面型镜像默认开启，ENABLE_VNC 默认 true）
; VNC 密码：VNC_PASSWORD（默认 114514），分辨率 VNC_GEOMETRY（默认 1920x1200x24）
[program:xvnc]
command=/usr/local/bin/dwc-if ENABLE_VNC /usr/local/bin/dwc-xvnc
autostart=true
autorestart=true
startretries=5
priority=20
stdout_logfile=/config/logs/xvnc.log
stderr_logfile=/config/logs/xvnc.err.log

; 桌面会话（Xvfb 模式下以 qwe 用户启动 xstartup 桌面）
[program:xstartup]
command=/usr/local/bin/dwc-if ENABLE_VNC /usr/local/bin/dwc-xstartup-su
autostart=true
autorestart=true
startretries=5
priority=25
stdout_logfile=/config/logs/xstartup.log
stderr_logfile=/config/logs/xstartup.err.log

[program:novnc]
command=/usr/local/bin/dwc-if ENABLE_VNC /usr/local/bin/dwc-novnc
autostart=true
autorestart=true
startretries=5
priority=30
stdout_logfile=/config/logs/novnc.log
stderr_logfile=/config/logs/novnc.err.log
