# NoMachine（仅 full/studio，ENABLE_NOMACHINE 默认 true）
; 客户端免费闭源，音频好，端口 4000
[program:nomachine]
command=/usr/local/bin/dwc-if ENABLE_NOMACHINE /usr/local/bin/dwc-nomachine
autostart=true
autorestart=true
startretries=3
priority=40
stdout_logfile=/config/logs/nomachine.log
stderr_logfile=/config/logs/nomachine.err.log
