# dropbear SSH 服务（默认开启）
; 用 dwc-if 控制：ENABLE_SSH 默认 true
; 当 sshd 已安装时 dwc-dropbear 会 exit 0 跳过，此时 supervisord 不应重启
[program:dropbear]
command=/usr/local/bin/dwc-if ENABLE_SSH /usr/local/bin/dwc-dropbear
autostart=true
autorestart=unexpected
startretries=3
priority=5
stdout_logfile=/config/logs/dropbear.log
stderr_logfile=/config/logs/dropbear.err.log
