# code-server（code 镜像，端口 8443，浏览器访问）
; ENABLE_CODE 默认 true
[program:code-server]
command=/usr/local/bin/dwc-if ENABLE_CODE /usr/local/bin/dwc-code-server
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/config/logs/code-server.log
stderr_logfile=/config/logs/code-server.err.log
